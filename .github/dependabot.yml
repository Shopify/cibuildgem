version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      rake-compiler:
        patterns:
          - "rake-compiler"
          - "rake-compiler-dock"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
