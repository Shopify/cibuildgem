name: "Run a end to end test on the dummy gem"
on: push
jobs:
  compile:
    timeout-minutes: 20
    name: "Cross compile the gem on different ruby versions"
    strategy:
      matrix:
        os: ["ubuntu-22.04"]
    runs-on: "${{ matrix.os }}"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3"
      - name: "Setup Ruby"
        uses: "ruby/setup-ruby@8aeb6ff8030dd539317f8e1769a044873b56ea71"
        with:
          ruby-version: "3.1.7"
          bundler-cache: true
          working-directory: "test/fixtures/dummy_gem"
      - name: "Run cibuildgem"
        uses: "./.github/actions/cibuildgem"
        with:
          step: "compile"
          working-directory: "test/fixtures/dummy_gem"
  test:
    timeout-minutes: 20
    name: "Run the test suite"
    needs: compile
    strategy:
      matrix:
        os: ["ubuntu-22.04"]
        rubies: ["3.1", "3.4"]
        type: ["cross", "native"]
    runs-on: "${{ matrix.os }}"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3"
      - name: "Setup Ruby"
        uses: "ruby/setup-ruby@8aeb6ff8030dd539317f8e1769a044873b56ea71"
        with:
          ruby-version: "${{ matrix.rubies }}"
          bundler-cache: true
          working-directory: "test/fixtures/dummy_gem"
      - name: "Run cibuildgem"
        uses: "./.github/actions/cibuildgem"
        with:
          step: "test_${{ matrix.type }}"
          working-directory: "test/fixtures/dummy_gem"
  install:
    timeout-minutes: 5
    name: "Verify the gem can be installed"
    needs: test
    strategy:
      matrix:
        os: ["ubuntu-22.04"]
    runs-on: "${{ matrix.os }}"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3"
      - name: "Setup Ruby"
        uses: "ruby/setup-ruby@8aeb6ff8030dd539317f8e1769a044873b56ea71"
        with:
          ruby-version: "3.4.7"
      - name: "Run cibuildgem"
        uses: "./.github/actions/cibuildgem"
        with:
          step: "install"
          working-directory: "test/fixtures/dummy_gem"

  # Make sure the precompiled binary doesn't use glibc symbols newer than 2.17. See issue #37.
  glibc_compat:
    timeout-minutes: 5
    name: "Check glibc symbol versions on the precompiled Linux binary"
    needs: compile
    runs-on: "ubuntu-22.04"
    env:
      MAX_ALLOWED_GLIBC: "2.17"
    steps:
      - name: "Download the staged Linux artifacts"
        uses: actions/download-artifact@v5
        with:
          name: "stage-Linux-X64"
          path: "stage"
      - name: "Inspect glibc symbol versions"
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          binaries=(stage/**/*.so)
          if [ ${#binaries[@]} -eq 0 ]; then
            echo "::error::No .so files found in the stage artifact"
            exit 1
          fi

          fail=0
          for binary in "${binaries[@]}"; do
            echo "::group::$binary"
            symbols_file="$binary.glibc.txt"
            objdump -T "$binary" | awk '/GLIBC_/{print $5}' | sort -u > "$symbols_file"
            cat "$symbols_file"
            while IFS= read -r ver; do
              ver_num=${ver#GLIBC_}
              if [ "$(printf '%s\n%s\n' "$ver_num" "$MAX_ALLOWED_GLIBC" | sort -V | tail -n1)" != "$MAX_ALLOWED_GLIBC" ]; then
                echo "::error file=$binary::References $ver, newer than allowed GLIBC_$MAX_ALLOWED_GLIBC"
                fail=1
              fi
            done < "$symbols_file"
            echo "::endgroup::"
          done
          exit $fail
